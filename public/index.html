<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metsabot — Eesti metsainfo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Metsabot</h1>
      <p class="alapealkiri">
        Vastused Eesti riiklikest andmeallikatest: metsaregister, EELIS,
        Statistikaamet, Maa- ja Ruumiamet.
      </p>
      <div id="tervis" class="tervis"></div>
    </header>

    <main>
      <div id="vestlus" class="vestlus">
        <div class="sonum bot">
          <div class="sisu">
            <p>Tere! Küsi midagi Eesti metsa kohta. Näiteks:</p>
          </div>
          <div class="naited" id="naited"></div>
        </div>
      </div>
    </main>

    <div id="maluriba" class="maluriba" hidden>
      <span></span>
      <button type="button" id="uus">Uus vestlus</button>
    </div>

    <form id="vorm" class="vorm">
      <input
        id="sisend"
        type="text"
        placeholder="Kas metsa raiutakse rohkem kui juurde kasvab?"
        autocomplete="off"
        required
      />
      <button type="submit" id="saada">Küsi</button>
    </form>

    <footer>
      <p>
        Bot ei anna juriidilist nõu. Raieload ja piirangud kinnita
        <a href="https://register.metsad.ee" target="_blank" rel="noopener">metsaportaalist</a>
        või Keskkonnaametist.
      </p>
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
